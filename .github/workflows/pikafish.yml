name: Pikafish-HCE

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Pikafish-x86-64:
    name: ${{ matrix.name }}${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      ARCH: x86-64${{ matrix.arch }}
      COMPILER: clang++
      COMP: clang
      EXE: pikafish${{ matrix.arch }}${{ matrix.ext }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            shell: bash
            arch: "-avx2"
          - name: Linux
            os: ubuntu-22.04
            shell: bash
            arch: "-bmi2"
          - name: Windows
            os: windows-latest
            shell: msys2 {0}
            ext: .exe
            arch: "-avx2"
          - name: Windows
            os: windows-latest
            shell: msys2 {0}
            ext: .exe
            arch: "-bmi2"
          - name: Windows
            os: windows-latest
            shell: msys2 {0}
            ext: .exe
            arch: "-avxvnni"
          - name: Windows
            os: windows-latest
            shell: msys2 {0}
            ext: .exe
            arch: "-avx512"
          - name: Windows
            os: windows-latest
            shell: msys2 {0}
            ext: .exe
            arch: "-vnni512"

    defaults:
      run:
        working-directory: src
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and Clang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Setup msys and install required packages
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          install: mingw-w64-clang-x86_64-clang make git expect

      - name: Download SDE package
        if: matrix.arch == '-avxvnni' || matrix.arch == '-avx512' || matrix.arch == '-vnni512'
        uses: petarpetrovt/setup-sde@v2.4
        with:
          environmentVariableName: SDE_DIR
          sdeVersion: 9.33.0

      - name: Compile ${{ matrix.arch }} build
        run: |
          SDE=""
          if [ -n "${SDE_DIR}" ]; then
            if [ -f "${SDE_DIR}/sde.exe" ]; then
              SDE="${SDE_DIR}/sde.exe -future --"
            elif [ -f "${SDE_DIR}/sde" ]; then
              SDE="${SDE_DIR}/sde -future --"
            fi
          fi
          make -j profile-build EXE=$EXE WINE_PATH="$SDE"
          make strip EXE=$EXE
          cp $EXE ../

      - uses: actions/upload-artifact@v4
        with:
          name: Pikafish-HCE-${{ matrix.name }}${{ matrix.arch }}
          path: ${{ env.EXE }}

  Pikafish-Linux-armv8:
    name: Linux-armv8
    runs-on: ubuntu-24.04-arm
    env:
      ARCH: armv8
      COMPILER: clang++
      COMP: clang
      EXE: pikafish-armv8
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Compile armv8 build
        run: |
          make -j profile-build EXE=$EXE
          make strip EXE=$EXE
          cp $EXE ../

      - uses: actions/upload-artifact@v4
        with:
          name: Pikafish-HCE-Linux-armv8
          path: ${{ env.EXE }}

  Pikafish-MacOS:
    name: MacOS-apple-silicon
    runs-on: macos-latest
    env:
      ARCH: apple-silicon
      COMPILER: clang++
      COMP: clang
      EXE: pikafish-apple-silicon
    defaults:
      run:
        working-directory: src
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Compile apple-silicon build
        run: |
          make -j profile-build EXE=$EXE
          make strip EXE=$EXE
          cp $EXE ../

      - uses: actions/upload-artifact@v4
        with:
          name: Pikafish-HCE-MacOS-apple-silicon
          path: ${{ env.EXE }}

  Pikafish-Android:
    name: Android-armv8
    runs-on: ubuntu-latest
    env:
      ARCH: armv8
      COMPILER: aarch64-linux-android21-clang++
      COMP: ndk
      EXE: pikafish-armv8
      LDFLAGS: "-static -Wno-unused-command-line-argument"
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          NDKV="21.4.7075529"
          ANDROID_ROOT=/usr/local/lib/android
          ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          echo "y" | $SDKMANAGER "ndk;$NDKV"
          ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDKV
          ANDROID_NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> $GITHUB_ENV

      - name: Compile armv8 build
        run: |
          export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
          make clean
          make -j build EXE=$EXE
          make strip EXE=$EXE
          cp $EXE ../

      - uses: actions/upload-artifact@v4
        with:
          name: Pikafish-HCE-Android-armv8
          path: ${{ env.EXE }}

  Pikafish:
    name: Pikafish-HCE
    runs-on: ubuntu-latest
    needs: [Pikafish-x86-64, Pikafish-Linux-armv8, Pikafish-MacOS, Pikafish-Android]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Pikafish-HCE-*
          path: Artifacts

      - name: Put binaries into OS-specific directories
        run: |
          mkdir -p Windows Linux MacOS Android
          mv Artifacts/Pikafish-HCE-Windows-*/* Windows
          mv Artifacts/Pikafish-HCE-Linux-*/* Linux
          mv Artifacts/Pikafish-HCE-MacOS-*/* MacOS
          mv Artifacts/Pikafish-HCE-Android-*/* Android

      - uses: actions/upload-artifact@v4
        with:
          name: Pikafish-HCE
          path: |
            Windows
            Linux
            MacOS
            Android
            AUTHORS
            Copying.txt
            README.md
            Top CPU Contributors.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            Windows/* Linux/* MacOS/* Android/* \
            --title "Pikafish-HCE ${{ github.ref_name }}" \
            --generate-notes
